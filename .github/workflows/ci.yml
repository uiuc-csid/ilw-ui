name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write # JUnit report annotations

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm check
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/unit-junit.xml
      - run: pnpm build-storybook
      - run: pnpm test:e2e
      - name: Publish test reports
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: test-results/*-junit.xml
      - name: Upload Storybook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: storybook-static

  # Publishes the Storybook built by `test` to Chromatic for visual review.
  # Runs on pushes only (a PR's branch push already covers it) and needs the
  # CHROMATIC_PROJECT_TOKEN repository secret. Settings: chromatic.config.json.
  chromatic:
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Chromatic walks git history to find baselines
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: storybook-static
      - uses: chromaui/action@18599f2ae5010524d496b86099c9b69a37f5d8d2 # v18.12.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
