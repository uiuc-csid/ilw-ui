name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # .github/workflows/upstream.yml runs it on its branch

permissions:
  contents: read
  checks: write # JUnit report annotations

jobs:
  test:
    runs-on: ubuntu-latest
    # Browsers and their system deps come from the image, so no `playwright install`.
    # The tag must match the playwright/@playwright/test versions in package.json
    # (tests/unit/playwright-container.test.ts checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/unit-junit.xml
      - run: pnpm build-storybook
      - run: pnpm test:e2e
      - name: Publish test reports
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: test-results/*-junit.xml
      - name: Upload Storybook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: storybook-static
