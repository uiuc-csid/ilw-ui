# Publishes Storybook to Chromatic for visual review
# (https://www.chromatic.com/docs/github-actions/). Push only: Chromatic
# recommends against pull_request, whose ephemeral merge commits pick the
# wrong baselines. Needs the CHROMATIC_PROJECT_TOKEN repository secret.
# Settings: chromatic.config.json. Skips Renovate's branches (renovate/*):
# dependency bumps would spend snapshots on every rebase; their merge to main
# still runs it.
name: Chromatic

on:
  push:
    branches-ignore:
      - 'renovate/**'
  workflow_dispatch: # .github/workflows/upstream.yml runs it on its branch

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Chromatic walks git history to find baselines
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Chromatic
        uses: chromaui/action@2b75e3340bcec86b4ae38c6a10f14831114e8137 # v18.14.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
