<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <fieldset class="ilw-input-entry-radio" id="fixture-term" role="radiogroup">
      <legend>Term</legend>
      <input id="fixture-term-{1}" name="term" type="radio" .value="fa">
      <label for="fixture-term-{1}">Fall</label>
      <input id="fixture-term-{2}" name="term" type="radio" .value="sp">
      <label for="fixture-term-{2}">Spring</label>
      <input disabled id="fixture-term-{3}" name="term" type="radio" .value="su">
      <label for="fixture-term-{3}">Summer</label>
      <input id="fixture-term-{4}" name="term" type="radio" .value="wi">
      <label for="fixture-term-{4}">Winter</label>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
    <div class="ilw-input-entry">
      <label for="fixture-after">Course</label>
      <input id="fixture-after" name="course" type="text" .value="">
    </div>
  </main>
</div>
