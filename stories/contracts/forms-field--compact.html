<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <div class="ilw-input-entry-compact">
      <label class="ilw-label-required" for="ilw-field-{1}">Course</label>
      <input aria-describedby="ilw-field-{1}-error" aria-invalid="true" id="ilw-field-{1}" name="course" required type="text" .value="CS">
      <p class="ilw-input-alert" id="ilw-field-{1}-error">Enter a course like CS 124.</p>
    </div>
    <div class="ilw-input-entry-compact">
      <label for="ilw-field-{2}">Term</label>
      <select id="ilw-field-{2}" name="term" .value="Fall 2026">
        <option .selected>Fall 2026</option>
        <option>Spring 2027</option>
      </select>
    </div>
    <div class="ilw-input-entry-checkbox-compact">
      <label for="ilw-field-{3}">Notify me</label>
      <input id="ilw-field-{3}" name="notify" type="checkbox" .value="on">
    </div>
  </main>
</div>
