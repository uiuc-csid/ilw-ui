<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <p>Fields marked * are required.</p>
    <fieldset aria-describedby="ilw-chips-{1}-description ilw-chips-{1}-error" aria-invalid="true" class="ilw-chips" id="ilw-chips-{1}" role="radiogroup">
      <legend class="ilw-label-required">Country</legend>
      <label class="ilw-chip">
        <input name="country-error" required type="radio" .value="us">
        United States</label><label class="ilw-chip">
        <input name="country-error" required type="radio" .value="ca">
        Canada</label><label class="ilw-chip">
        <input name="country-error" required type="radio" .value="mx">
        Mexico</label>
      <p class="ilw-input-description" id="ilw-chips-{1}-description">Applicants are counted by home country.</p>
      <p class="ilw-input-alert" id="ilw-chips-{1}-error">Choose a country.</p>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
    <fieldset aria-describedby="ilw-chips-{2}-description ilw-chips-{2}-error" class="ilw-chips" id="ilw-chips-{2}">
      <legend class="ilw-label-required">Tables to export</legend>
      <label class="ilw-chip">
        <input aria-invalid="true" name="schemas-error" type="checkbox" .value="course">
        Courses</label><label class="ilw-chip">
        <input aria-invalid="true" name="schemas-error" type="checkbox" .value="section">
        Sections</label><label class="ilw-chip">
        <input aria-invalid="true" name="schemas-error" type="checkbox" .value="instructor">
        Instructors</label>
      <p class="ilw-input-description" id="ilw-chips-{2}-description">Each table is a separate CSV file.</p>
      <p class="ilw-input-alert" id="ilw-chips-{2}-error">Choose at least one table.</p>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
  </main>
</div>
