<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <form>
      <p class="ilw-input-alert" role="alert">1 field needs attention.</p>
      <fieldset class="ilw-fieldset">
        <legend>Contact</legend>
        <div class="ilw-input-entry">
          <label for="long">Mailing address</label>
          <input autocomplete="street-address" class="ilw-input-long" id="long" name="address" type="text" .value="">
        </div>
        <div class="ilw-input-entry">
          <label for="short">Zip</label>
          <input autocomplete="postal-code" class="ilw-input-short" id="short" name="zip" type="text" .value="">
        </div>
      </fieldset>
      <fieldset class="ilw-input-entry-radio">
        <legend>Term</legend>
        <input id="term-fa" name="term" type="radio" .checked .value="fa">
        <label for="term-fa">Fall</label>
        <input id="term-sp" name="term" type="radio" .value="sp">
        <label for="term-sp">Spring</label>
      </fieldset>
      <fieldset class="ilw-input-entry-radio-vertical">
        <legend>Year</legend>
        <input id="year-{1}" name="year" type="radio" .value="1">
        <label for="year-{1}">First</label>
        <input id="year-{2}" name="year" type="radio" .value="2">
        <label for="year-{2}">Second</label>
        <input id="year-{3}" name="year" type="radio" .value="3">
        <label for="year-{3}">Third</label>
      </fieldset>
      <fieldset class="ilw-input-entry-radio-compact">
        <legend>Campus</legend>
        <input id="campus-uc" name="campus" type="radio" .value="uc">
        <label for="campus-uc">Urbana-Champaign</label>
        <input id="campus-ch" name="campus" type="radio" .value="ch">
        <label for="campus-ch">Chicago</label>
      </fieldset>
      <fieldset class="ilw-input-entry-radio-vertical-compact">
        <legend>Format</legend>
        <input id="format-on" name="format" type="radio" .value="on">
        <label for="format-on">Online</label>
        <input id="format-in" name="format" type="radio" .value="in">
        <label for="format-in">In person</label>
      </fieldset>
      <div class="ilw-input-disclaimer">
        <input id="agree" name="agree" type="checkbox" .value="on">
        <label for="agree">I have read the course policies.</label>
      </div>
    </form>
  </main>
</div>
