<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <fieldset aria-describedby="ilw-chips-{1}-description" class="ilw-chips" id="ilw-chips-{1}" role="radiogroup">
      <legend>Country</legend>
      <label class="ilw-chip">
        <input name="country-dark" type="radio" .checked .value="us">
        United States</label><label class="ilw-chip">
        <input name="country-dark" type="radio" .value="ca">
        Canada</label><label class="ilw-chip">
        <input name="country-dark" type="radio" .value="mx">
        Mexico</label><label class="ilw-chip">
        <input name="country-dark" type="radio" .value="in">
        India</label><label class="ilw-chip">
        <input name="country-dark" type="radio" .value="cn">
        China</label><label class="ilw-chip">
        <input disabled name="country-dark" type="radio" .value="kr">
        South Korea</label>
      <p class="ilw-input-description" id="ilw-chips-{1}-description">Students whose home country is any of these are counted.</p>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">us</output> (changes: <span data-testid="changes"></span>)</p>
    <fieldset aria-describedby="ilw-chips-{2}-error" class="ilw-chips" id="ilw-chips-{2}">
      <legend>Tables to export</legend>
      <label class="ilw-chip">
        <input aria-invalid="true" name="schemas-dark" type="checkbox" .value="course">
        Courses</label><label class="ilw-chip">
        <input aria-invalid="true" name="schemas-dark" type="checkbox" .value="section">
        Sections</label><label class="ilw-chip">
        <input aria-invalid="true" name="schemas-dark" type="checkbox" .value="instructor">
        Instructors</label>
      <p class="ilw-input-alert" id="ilw-chips-{2}-error">Choose at least one table.</p>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
  </main>
</div>
