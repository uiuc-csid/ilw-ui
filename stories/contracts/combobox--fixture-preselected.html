<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <form>
      <p><label>Before <input name="before" type="text" .value=""></label></p>
      <p>

          <div aria-labelledby="person-label" class="combobox-popup" data-part="content" data-scope="combobox" data-state="closed" hidden id="person-popup" role="listbox" tabindex="-1">
            <div aria-labelledby="person-popup-group-Faculty-label" data-part="item-group" data-scope="combobox" id="person-popup-group-Faculty" role="group">
              <div class="combobox-group-label" data-part="item-group-label" data-scope="combobox" id="person-popup-group-Faculty-label" role="presentation">Faculty</div>

              <div data-part="item" data-scope="combobox" data-state="unchecked" data-value="dadams" id="person-popup-opt-dadams" role="option" tabindex="-1">Drew Adams</div>
            </div>
          </div>
        </span>
      </p>
      <p><label>After <input name="after" type="text" .value=""></label></p>

    <p>Selected: <output data-testid="selected">cclark</output> (<span data-testid="changes">0</span> changes, <span data-testid="submits">0</span> submits)</p>
  </main>
