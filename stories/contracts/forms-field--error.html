<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <div class="ilw-input-entry">
      <label class="ilw-label-required" for="ilw-field-{1}">Email</label>
      <input aria-describedby="ilw-field-{1}-description ilw-field-{1}-error" aria-invalid="true" id="ilw-field-{1}" name="email" required type="email" .value="netid">
      <p class="ilw-input-description" id="ilw-field-{1}-description">We only use it to reply.</p>
      <p class="ilw-input-alert" id="ilw-field-{1}-error">Enter an email address like name@illinois.edu.</p>
    </div>
  </main>
</div>
