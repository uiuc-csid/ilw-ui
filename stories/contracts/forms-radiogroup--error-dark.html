<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <fieldset aria-describedby="ilw-radio-group-{1}-error" aria-invalid="true" class="ilw-input-entry-radio" id="ilw-radio-group-{1}" role="radiogroup">
      <legend class="ilw-label-required">Campus</legend>
      <input id="ilw-radio-group-{1}-0" name="campus-dark" required type="radio" .value="uc">
      <label for="ilw-radio-group-{1}-0">Urbana-Champaign</label>
      <input id="ilw-radio-group-{1}-1" name="campus-dark" required type="radio" .value="ch">
      <label for="ilw-radio-group-{1}-1">Chicago</label>
      <p class="ilw-input-alert" id="ilw-radio-group-{1}-error">Choose a campus.</p>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
  </main>
</div>
