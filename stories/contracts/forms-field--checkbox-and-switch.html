<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <div class="ilw-input-entry-checkbox">
      <label for="ilw-field-{1}">Email me updates</label>
      <input aria-describedby="ilw-field-{1}-description" id="ilw-field-{1}" name="updates" type="checkbox" .checked .value="on">
      <p class="ilw-input-description" id="ilw-field-{1}-description">At most one a week.</p>
    </div>
    <div class="ilw-input-entry-checkbox">
      <label for="ilw-field-{2}">Show weekends</label>
      <input class="ilw-switch" id="ilw-field-{2}" name="weekends" role="switch" type="checkbox" .checked .value="on">
    </div>
  </main>
</div>
