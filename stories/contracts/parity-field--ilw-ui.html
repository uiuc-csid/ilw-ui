<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <form>
      <div class="ilw-input-entry">
        <label for="ilw-ui-text">Text Box</label>
        <input id="ilw-ui-text" type="text" .value="">
      </div>
      <div class="ilw-input-entry">
        <label for="ilw-ui-short">Short Text Box</label>
        <input class="ilw-input-short" id="ilw-ui-short" type="text" .value="">
      </div>
      <div class="ilw-input-entry">
        <label for="ilw-ui-long">Long Text Box With Instructions</label>
        <input aria-describedby="ilw-ui-long-description" class="ilw-input-long" id="ilw-ui-long" type="text" .value="">
        <p class="ilw-input-description" id="ilw-ui-long-description">Some explanatory text which might get long.</p>
      </div>
      <div class="ilw-input-entry">
        <label class="ilw-label-required" for="ilw-ui-required">Required Text Box</label>
        <input id="ilw-ui-required" required type="text" .value="">
      </div>
      <div class="ilw-input-entry">
        <label for="ilw-ui-area">Text Area</label>
        <textarea id="ilw-ui-area" .value=""></textarea>
      </div>
      <div class="ilw-input-entry">
        <label for="ilw-ui-select">Dropdown</label>
        <select id="ilw-ui-select" .value="">
          <option value .selected>Choose one</option>
          <option value="1">First Item</option>
        </select>
      </div>
      <div class="ilw-input-entry-checkbox">
        <label for="ilw-ui-checkbox">Checkbox</label>
        <input id="ilw-ui-checkbox" type="checkbox" .checked .value="on">
      </div>
      <fieldset class="ilw-input-entry-radio">
        <legend>Radio Buttons Title</legend>
        <input id="ilw-ui-radio-{1}" name="ilw-ui-radio" type="radio" .value="0">
        <label for="ilw-ui-radio-{1}">First Item</label>
        <input id="ilw-ui-radio-{2}" name="ilw-ui-radio" type="radio" .value="1">
        <label for="ilw-ui-radio-{2}">Second Item</label>
        <input id="ilw-ui-radio-{3}" name="ilw-ui-radio" type="radio" .value="2">
        <label for="ilw-ui-radio-{3}">Third Item</label>
      </fieldset>
      <fieldset class="ilw-input-entry-radio-vertical">
        <legend>Vertical Radio Buttons Title</legend>
        <input id="ilw-ui-radio-vertical-{4}" name="ilw-ui-radio-vertical" type="radio" .value="0">
        <label for="ilw-ui-radio-vertical-{4}">First Item</label>
        <input id="ilw-ui-radio-vertical-{5}" name="ilw-ui-radio-vertical" type="radio" .value="1">
        <label for="ilw-ui-radio-vertical-{5}">Second Item</label>
        <input id="ilw-ui-radio-vertical-{6}" name="ilw-ui-radio-vertical" type="radio" .value="2">
        <label for="ilw-ui-radio-vertical-{6}">Third Item</label>
      </fieldset>
      <div class="ilw-input-entry">
        <label for="ilw-ui-toggle">Toggle Checkbox</label>
        <input class="ilw-switch" id="ilw-ui-toggle" role="switch" type="checkbox" .value="on">
      </div>
      <h2>Compact Versions</h2>
      <div class="ilw-input-entry-compact">
        <label for="ilw-ui-text-c">Text Box</label>
        <input id="ilw-ui-text-c" type="text" .value="">
      </div>
      <div class="ilw-input-entry-compact">
        <label for="ilw-ui-help-c">Text Box With Instructions</label>
        <input aria-describedby="ilw-ui-help-c-description" id="ilw-ui-help-c" type="text" .value="">
        <p class="ilw-input-description" id="ilw-ui-help-c-description">Some explanatory text which might get long.</p>
      </div>
      <div class="ilw-input-entry-checkbox-compact">
        <label for="ilw-ui-checkbox-c">Checkbox</label>
        <input id="ilw-ui-checkbox-c" type="checkbox" .value="on">
      </div>
      <fieldset class="ilw-input-entry-radio-compact">
        <legend>Radio Buttons Title</legend>
        <input id="ilw-ui-radio-compact-{7}" name="ilw-ui-radio-compact" type="radio" .value="0">
        <label for="ilw-ui-radio-compact-{7}">First Item</label>
        <input id="ilw-ui-radio-compact-{8}" name="ilw-ui-radio-compact" type="radio" .value="1">
        <label for="ilw-ui-radio-compact-{8}">Second Item</label>
        <input id="ilw-ui-radio-compact-{9}" name="ilw-ui-radio-compact" type="radio" .value="2">
        <label for="ilw-ui-radio-compact-{9}">Third Item</label>
      </fieldset>
      <fieldset class="ilw-input-entry-radio-vertical-compact">
        <legend>Vertical Radio Buttons Title</legend>
        <input id="ilw-ui-radio-vertical-compact-{10}" name="ilw-ui-radio-vertical-compact" type="radio" .value="0">
        <label for="ilw-ui-radio-vertical-compact-{10}">First Item</label>
        <input id="ilw-ui-radio-vertical-compact-{11}" name="ilw-ui-radio-vertical-compact" type="radio" .value="1">
        <label for="ilw-ui-radio-vertical-compact-{11}">Second Item</label>
        <input id="ilw-ui-radio-vertical-compact-{12}" name="ilw-ui-radio-vertical-compact" type="radio" .value="2">
        <label for="ilw-ui-radio-vertical-compact-{12}">Third Item</label>
      </fieldset>
      <h2>Misc</h2>
      <div class="ilw-input-disclaimer">
        <input id="ilw-ui-disclaimer" type="checkbox" .value="on">
        <label for="ilw-ui-disclaimer">The opinions and referrals on this website are for information only.</label>
      </div>
      <fieldset class="ilw-fieldset">
        <legend>Field Set Title</legend>
        <div class="ilw-input-entry">
          <label for="ilw-ui-fname">First name</label>
          <input class="ilw-input-long" id="ilw-ui-fname" type="text" .value="">
        </div>
      </fieldset>
      <div class="ilw-input-alert">Alert for forms</div>
    </form>
  </main>
</div>
