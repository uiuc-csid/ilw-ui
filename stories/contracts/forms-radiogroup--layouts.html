<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <fieldset class="ilw-input-entry-radio-vertical" id="ilw-radio-group-{1}" role="radiogroup">
      <legend>Year</legend>
      <input id="ilw-radio-group-{1}-0" name="year" type="radio" .value="1">
      <label for="ilw-radio-group-{1}-0">First</label>
      <input id="ilw-radio-group-{1}-1" name="year" type="radio" .value="2">
      <label for="ilw-radio-group-{1}-1">Second</label>
      <input id="ilw-radio-group-{1}-2" name="year" type="radio" .value="3">
      <label for="ilw-radio-group-{1}-2">Third</label>
      <input id="ilw-radio-group-{1}-3" name="year" type="radio" .value="4">
      <label for="ilw-radio-group-{1}-3">Fourth</label>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
    <fieldset aria-describedby="ilw-radio-group-{2}-description" class="ilw-input-entry-radio-compact" id="ilw-radio-group-{2}" role="radiogroup">
      <legend>Term</legend>
      <input id="ilw-radio-group-{2}-0" name="term-c" type="radio" .value="fa">
      <label for="ilw-radio-group-{2}-0">Fall</label>
      <input id="ilw-radio-group-{2}-1" name="term-c" type="radio" .value="sp">
      <label for="ilw-radio-group-{2}-1">Spring</label>
      <input disabled id="ilw-radio-group-{2}-2" name="term-c" type="radio" .value="su">
      <label for="ilw-radio-group-{2}-2">Summer</label>
      <p class="ilw-input-description" id="ilw-radio-group-{2}-description">Choose the term you will teach.</p>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
    <fieldset class="ilw-input-entry-radio-vertical-compact" id="ilw-radio-group-{3}" role="radiogroup">
      <legend>Year (compact)</legend>
      <input id="ilw-radio-group-{3}-0" name="year-c" type="radio" .value="1">
      <label for="ilw-radio-group-{3}-0">First</label>
      <input id="ilw-radio-group-{3}-1" name="year-c" type="radio" .value="2">
      <label for="ilw-radio-group-{3}-1">Second</label>
      <input id="ilw-radio-group-{3}-2" name="year-c" type="radio" .value="3">
      <label for="ilw-radio-group-{3}-2">Third</label>
      <input id="ilw-radio-group-{3}-3" name="year-c" type="radio" .value="4">
      <label for="ilw-radio-group-{3}-3">Fourth</label>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">none</output> (changes: <span data-testid="changes"></span>)</p>
  </main>
</div>
