<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <form>
      <div class="ilw-input-entry">
        <label class="ilw-label-required" for="fixture-name">Name</label>
        <input autocomplete="name" id="fixture-name" name="name" required type="text" .value="">
      </div>
      <div class="ilw-input-entry-checkbox">
        <label for="fixture-updates">Email me updates</label>
        <input id="fixture-updates" name="updates" type="checkbox" .value="on">
      </div>
      <div class="ilw-input-entry-checkbox">
        <label for="fixture-weekends">Show weekends</label>
        <input class="ilw-switch" id="fixture-weekends" name="weekends" role="switch" type="checkbox" .value="on">
      </div>
      <fieldset class="ilw-input-entry-radio">
        <legend>Term</legend>
        <input id="fixture-fa" name="term" type="radio" .checked .value="fa">
        <label for="fixture-fa">Fall</label>
        <input id="fixture-sp" name="term" type="radio" .value="sp">
        <label for="fixture-sp">Spring</label>
        <input id="fixture-su" name="term" type="radio" .value="su">
        <label for="fixture-su">Summer</label>
      </fieldset>
      <div class="ilw-input-entry-compact">
        <label for="fixture-course">Course</label>
        <input id="fixture-course" name="course" type="text" .value="">
      </div>
    </form>
  </main>
</div>
