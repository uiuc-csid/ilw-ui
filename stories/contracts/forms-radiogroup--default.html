<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <fieldset aria-describedby="ilw-radio-group-{1}-description" class="ilw-input-entry-radio" id="ilw-radio-group-{1}" role="radiogroup">
      <legend>Term</legend>
      <input id="ilw-radio-group-{1}-0" name="term" type="radio" .value="fa">
      <label for="ilw-radio-group-{1}-0">Fall</label>
      <input id="ilw-radio-group-{1}-1" name="term" type="radio" .checked .value="sp">
      <label for="ilw-radio-group-{1}-1">Spring</label>
      <input disabled id="ilw-radio-group-{1}-2" name="term" type="radio" .value="su">
      <label for="ilw-radio-group-{1}-2">Summer</label>
      <p class="ilw-input-description" id="ilw-radio-group-{1}-description">Choose the term you will teach.</p>
    </fieldset>
    <p>Chosen: <output data-testid="chosen">sp</output> (changes: <span data-testid="changes">sp</span>)</p>
  </main>
</div>
