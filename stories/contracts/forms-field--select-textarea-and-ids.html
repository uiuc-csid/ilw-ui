<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <div class="ilw-input-entry">
      <label for="dept">Department</label>
      <select aria-describedby="dept-help dept-problem" aria-invalid="true" id="dept" name="dept" .value="">
        <option value .selected>Choose one</option>
        <option>Computer Science</option>
        <option>Mathematics</option>
      </select>
      <p class="ilw-input-description" id="dept-help">Your home department.</p>
      <p class="ilw-input-alert" id="dept-problem">Choose a department.</p>
    </div>
    <div class="ilw-input-entry">
      <label for="ilw-field-{1}">Notes <em>(optional)</em></label>
      <textarea id="ilw-field-{1}" name="notes" .value=""></textarea>
    </div>
  </main>
</div>
