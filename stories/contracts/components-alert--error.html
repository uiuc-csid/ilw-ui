  <main id="main-content" tabindex="-1">
    <h1>Course settings</h1>
    <p>Settings for CS 124, Fall 2026. Changes apply to every section of the course.</p>

      <div class="ilw-alert-body">
        <span class="ilw-visually-hidden">Error:</span>
        <p class="ilw-alert-title">Your changes weren't saved</p>
        <p>The server didn't answer. Your edits are still in the form below.</p>
        <div class="ilw-alert-actions">
          <button class="ilw-button" type="button">Try again</button>
          <a class="ilw-button" href="#login">Log in again</a>

          <rect fill="none" height="256" width="256"></rect>
          <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path>

    <form>
      <div class="ilw-input-entry">
        <label class="ilw-label-required" for="ilw-field-{1}">Course title</label>
        <input id="ilw-field-{1}" name="title" required type="text" .value="Introduction to Computer Science">
      </div>
      <div class="ilw-input-entry">
        <label for="ilw-field-{2}">Enrollment cap</label>
        <input aria-describedby="ilw-field-{2}-description" id="ilw-field-{2}" name="cap" type="number" .value="900">
        <p class="ilw-input-description" id="ilw-field-{2}-description">Across all sections.</p>
      </div>
      <p><button class="ilw-button" type="submit">Save</button></p>
    </form>
  </main>
