<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <h2>Post a research opportunity</h2>
    <p>Undergraduates see the opportunity with its mentors' names. Add every faculty member who will supervise.</p>
    <form>
      <p><label>Title <input name="title" type="text" .value="Soil microbiome survey"></label></p>
      <p>
        <label for="mentors-cb" id="mentors-label">Faculty mentors</label><br> <span class="combobox combobox-multi" data-part="root" data-scope="combobox" id="combobox:mentors-cb"> <input aria-autocomplete="list" aria-controls="mentors-popup" aria-expanded="false" autocapitalize="none" autocomplete="off" autocorrect="off" class="combobox-input" data-part="input" data-scope="combobox" data-state="closed" id="mentors-cb" placeholder="Type a name or NetID" role="combobox" spellcheck="false" type="text" .value="">
          <div aria-labelledby="mentors-label" aria-multiselectable="true" class="combobox-popup" data-empty data-part="content" data-scope="combobox" data-state="closed" hidden id="mentors-popup" role="listbox" tabindex="-1"></div>
          <span class="ilw-visually-hidden" role="status"></span>
        </span>
      </p>
      <p><label>Notes <input name="notes" type="text" .value=""></label></p>
      <p><button type="submit">Post opportunity</button></p>
    </form>
    <p>Selected: <output data-testid="selected"></output> (<span data-testid="changes">0</span> changes). Posted: <output data-testid="posted"></output></p>
    <aside aria-labelledby="stub-server-heading" class="stub-server">
      <h2 id="stub-server-heading">Test server (story only)</h2>
      <p>No searches waiting.</p>
    </aside>
  </main>
</div>
