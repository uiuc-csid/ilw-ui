<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <form>
      <p><label>Before <input name="before" type="text" .value=""></label></p>
      <p>
        <label for="person-cb" id="person-label">Person</label> <span class="combobox" data-part="root" data-scope="combobox" id="combobox:person-cb"><input aria-activedescendant="person-popup-opt-bbrown" aria-autocomplete="list" aria-controls="person-popup" aria-expanded="true" autocapitalize="none" autocomplete="off" autocorrect="off" class="combobox-input" data-part="input" data-scope="combobox" data-state="open" id="person-cb" placeholder="Select faculty or type NetID" role="combobox" spellcheck="false" type="text" .value="blak">
          <div aria-labelledby="person-label" class="combobox-popup" data-part="content" data-placement="bottom" data-scope="combobox" data-side="bottom" data-state="open" id="person-popup" role="listbox" style="--layer-index: 0; --nested-layer-count: 0; pointer-events: auto" tabindex="-1">
            <div aria-labelledby="person-popup-group-Faculty-label" data-part="item-group" data-scope="combobox" id="person-popup-group-Faculty" role="group">

              <div data-highlighted data-part="item" data-scope="combobox" data-state="unchecked" data-value="bbrown" id="person-popup-opt-bbrown" role="option" tabindex="-1">Blake Brown</div>
            </div>
          </div>
        </span>
      </p>
      <p><label>After <input name="after" type="text" .value=""></label></p>

    <p>Selected: <output data-testid="selected"></output> (<span data-testid="changes">0</span> changes, <span data-testid="submits">0</span> submits)</p>
  </main>
</div>
