<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <h2>Post a research opportunity</h2>
    <p>Undergraduates see the opportunity with its mentors' names. Add every faculty member who will supervise.</p>
    <form>
      <p><label>Title <input name="title" type="text" .value="Soil microbiome survey"></label></p>
      <p>
        <label for="mentors-cb" id="mentors-label">Faculty mentors</label><br> <span class="combobox combobox-multi" data-part="root" data-scope="combobox" id="combobox:mentors-cb">
          <ul aria-labelledby="mentors-label" class="combobox-tokens">
            <li class="combobox-token" data-value="dadams">
              <span class="combobox-token-label">Drew Adams</span>
              <button aria-label="Remove Drew Adams" class="combobox-token-remove" type="button">
                <span aria-hidden="true">×</span>
              </button>
            </li>
          </ul>
          <input aria-activedescendant="mentors-popup-opt-cclark" aria-autocomplete="list" aria-controls="mentors-popup" aria-expanded="true" autocapitalize="none" autocomplete="off" autocorrect="off" class="combobox-input" data-part="input" data-scope="combobox" data-state="open" id="mentors-cb" placeholder="Type a name or NetID" role="combobox" spellcheck="false" type="text" .value="cl">
          <div aria-labelledby="mentors-label" aria-multiselectable="true" class="combobox-popup" data-part="content" data-placement="bottom" data-scope="combobox" data-side="bottom" data-state="open" id="mentors-popup" role="listbox" style="--layer-index: 0; --nested-layer-count: 0; pointer-events: auto" tabindex="-1">
            <div data-highlighted data-part="item" data-scope="combobox" data-state="unchecked" data-value="cclark" id="mentors-popup-opt-cclark" role="option" tabindex="-1">Casey Clark</div>
          </div>
          <span class="ilw-visually-hidden" role="status">1 result</span>
          <input name="mentors" type="hidden" .value="dadams">
        </span>
      </p>
      <p><label>Notes <input name="notes" type="text" .value=""></label></p>
      <p><button type="submit">Post opportunity</button></p>
    </form>
    <p>Selected: <output data-testid="selected">dadams</output> (<span data-testid="changes">1</span> changes). Posted: <output data-testid="posted"></output></p>
    <aside aria-labelledby="stub-server-heading" class="stub-server">
      <h2 id="stub-server-heading">Test server (story only)</h2>
      <p>No searches waiting.</p>
    </aside>
  </main>
</div>
