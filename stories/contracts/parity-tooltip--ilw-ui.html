<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <div class="tooltip-parity-row">
      <span class="ilw-tooltip ilw-tooltip--top-center ilw-tooltip--anchored">
        <button aria-describedby="ilw-tooltip-{1}" class="ilw-button" type="button">Export</button>
        <span class="ilw-tooltip-bubble" id="ilw-tooltip-{1}" popover="manual" role="tooltip">Download the grades as a CSV file</span>
      </span>
      <span class="ilw-tooltip ilw-tooltip--top-center ilw-tooltip--anchored">
        <button aria-describedby="ilw-tooltip-{2}" class="ilw-button" type="button">Print</button>
        <span class="ilw-tooltip-bubble" id="ilw-tooltip-{2}" popover="manual" role="tooltip" theme="blue">Print the table on one page per section</span>
      </span>
    </div>
  </main>
</div>
