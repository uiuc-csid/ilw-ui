<div class="ilw-page ilw-format" id="top" tabindex="-1">
  <a class="ilw-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
    <div class="chips-surfaces">
      <section aria-label="white surface" class="chips-surface" theme="white">
        <fieldset class="ilw-chips" id="ilw-chips-{1}" role="radiogroup">
          <legend>Country (white)</legend>
          <label class="ilw-chip">
            <input name="country-white" type="radio" .value="us">
            United States</label><label class="ilw-chip">
            <input name="country-white" type="radio" .checked .value="ca">
            Canada</label><label class="ilw-chip">
            <input name="country-white" type="radio" .value="mx">
            Mexico</label>
        </fieldset>
        <p>Chosen: <output data-testid="chosen">ca</output> (changes: <span data-testid="changes"></span>)</p>
      </section>
      <section aria-label="gray surface" class="chips-surface" theme="gray">
        <fieldset class="ilw-chips" id="ilw-chips-{2}" role="radiogroup">
          <legend>Country (gray)</legend>
          <label class="ilw-chip">
            <input name="country-gray" type="radio" .value="us">
            United States</label><label class="ilw-chip">
            <input name="country-gray" type="radio" .checked .value="ca">
            Canada</label><label class="ilw-chip">
            <input name="country-gray" type="radio" .value="mx">
            Mexico</label>
        </fieldset>
        <p>Chosen: <output data-testid="chosen">ca</output> (changes: <span data-testid="changes"></span>)</p>
      </section>
      <section aria-label="blue surface" class="chips-surface" theme="blue">
        <fieldset class="ilw-chips" id="ilw-chips-{3}" role="radiogroup">
          <legend>Country (blue)</legend>
          <label class="ilw-chip">
            <input name="country-blue" type="radio" .value="us">
            United States</label><label class="ilw-chip">
            <input name="country-blue" type="radio" .checked .value="ca">
            Canada</label><label class="ilw-chip">
            <input name="country-blue" type="radio" .value="mx">
            Mexico</label>
        </fieldset>
        <p>Chosen: <output data-testid="chosen">ca</output> (changes: <span data-testid="changes"></span>)</p>
      </section>
      <section aria-label="orange surface" class="chips-surface" theme="orange">
        <fieldset class="ilw-chips" id="ilw-chips-{4}" role="radiogroup">
          <legend>Country (orange)</legend>
          <label class="ilw-chip">
            <input name="country-orange" type="radio" .value="us">
            United States</label><label class="ilw-chip">
            <input name="country-orange" type="radio" .checked .value="ca">
            Canada</label><label class="ilw-chip">
            <input name="country-orange" type="radio" .value="mx">
            Mexico</label>
        </fieldset>
        <p>Chosen: <output data-testid="chosen">ca</output> (changes: <span data-testid="changes"></span>)</p>
      </section>
    </div>
  </main>
</div>
