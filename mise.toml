[settings]
idiomatic_version_file_enable_tools = ['pnpm', 'node']

[env]
# Project binaries (vitest, playwright, storybook, svelte-check) on PATH.
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.storybook]
description = "Run the Storybook workbench on :6006"
run = "pnpm storybook"

[tasks."storybook:react"]
description = "Run the React Storybook workbench on :6008"
run = "pnpm storybook:react"

[tasks.test]
description = "Unit + story tests (both frameworks), then build both Storybooks, run the Playwright keyboard specs and compare the builds' story ids"
run = "pnpm test && pnpm build-storybook && pnpm build-storybook:react && pnpm test:e2e && pnpm compare-index"

[tasks."vendor:toolkit"]
description = "Refresh the vendored Illinois Web Toolkit (vendor/illinois-toolkit) from its CDN"
run = "sh scripts/vendor-toolkit.sh"

[tasks."vendor:footer"]
description = "Refresh the campus footer content (src/core/campus-footer.ts) from the brand API"
run = "node scripts/vendor-footer.mjs"
