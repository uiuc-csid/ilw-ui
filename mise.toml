[settings]
idiomatic_version_file_enable_tools = ['pnpm', 'node']

[env]
# Project binaries (vitest, playwright, storybook, svelte-check) on PATH.
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.storybook]
description = "Run the Storybook workbench on :6006"
run = "pnpm storybook"

[tasks.test]
description = "Unit + story tests, then build Storybook and run the Playwright keyboard specs"
run = "pnpm test && pnpm build-storybook && pnpm test:e2e"

[tasks."vendor:toolkit"]
description = "Refresh the vendored Illinois Web Toolkit (vendor/illinois-toolkit) from its CDN"
run = "sh scripts/vendor-toolkit.sh"

[tasks."vendor:footer"]
description = "Refresh the campus footer content (src/core/campus-footer.ts) from the brand API"
run = "node scripts/vendor-footer.mjs"
